name: Premium Subscription Feature Checks

on:
  push:
    branches:
      - feature/premium-early-access-subscription-wallet
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run lint
      - name: Subscription entitlement tests
        run: bun run test:subscription
      - name: Early-access policy tests
        run: bun run test:early-access
      - name: Production build
        run: bun run build
